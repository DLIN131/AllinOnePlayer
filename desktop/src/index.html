<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src * data: blob: cbz: file:; media-src * blob: file: vh:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; worker-src 'self' blob:; connect-src https: blob: vh: cbz:"
    />
    <title>AllinOnePlayer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside class="side">
      <div class="brand"><span class="logo"><i class="ic">&#xe13c;</i></span><b>AllinOne</b></div>
      <nav id="nav"></nav>
      <button id="version" class="version" type="button" title="更新紀錄"></button>
    </aside>
    <main id="view"></main>

    <div id="player" class="player hidden"></div>
    <div id="reader" class="reader hidden"></div>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script src="version.js"></script>
    <script src="../node_modules/hls.js/dist/hls.min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
